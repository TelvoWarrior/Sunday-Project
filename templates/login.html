<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Log in</title>
</head>

<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand bg-body-tertiary border-bottom">
        <div class="container">
            <a class="navbar-brand" href="/">Sunday Project</a>
            <div class="ms-auto d-flex gap-2">
                <a class="btn btn-primary" href="/register">Register</a>
            </div>
        </div>
    </nav>
    <main class="container d-flex justify-content-center align-items-center flex-grow-1">

        <form class="w-100" style="max-width: 360px;" method="post" action="/login">
            <h1 class="h3 mb-4 fw-normal text-center">Log in</h1>

            <div class="mb-3">
                <input name="login" type="text" class="form-control" placeholder="Login" required autofocus>
            </div>

            <div class="mb-3">
                <input name="password" type="password" class="form-control" placeholder="Password" required>
            </div>

            <button class="btn btn-primary w-100 py-2" type="submit">
                Submit
            </button>
        </form>
    </main>
</body>

</html>
