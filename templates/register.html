<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Register</title>
</head>

<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand bg-body-tertiary border-bottom">
        <div class="container">
            <a class="navbar-brand" href="/">Sunday Project</a>
            <div class="ms-auto d-flex gap-2">
                <a class="btn btn-outline-light" href="/login">Log in</a>
            </div>
        </div>
    </nav>
    <main class="container d-flex justify-content-center align-items-center flex-grow-1">
        <div class="modal fade" id="failedModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Failure</h5>

                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">
                        The user exists.
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-danger" data-bs-dismiss="modal">
                            Got it
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <form class="w-100" style="max-width: 360px;" method="post" action="/register">
            <h1 class="h3 mb-4 fw-normal text-center">Register</h1>

            <div class="mb-3">
                <input name="login" type="text" class="form-control" placeholder="Login" required autofocus>
            </div>

            <div class="mb-3">
                <input name="password" type="password" class="form-control" placeholder="Password" required>
            </div>

            <button class="btn btn-primary w-100 py-2" type="submit">
                Submit
            </button>
        </form>

    </main>

    <div class="modal fade" id="successModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Success</h5>

                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    The user was successfuly created.
                </div>

                <div class="modal-footer">
                    <a href="/" class="btn btn-success">
                        Got it
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {{if eq .Error "login_exists"}}
    <script>
        const modalError = new bootstrap.Modal(
            document.getElementById("failedModal")
        );

        modalError.show();
    </script>
    {{end}}
    {{if .Success}}
    <script>
        const modalSuccess = new bootstrap.Modal(
            document.getElementById("successModal")
        );

        modalSuccess.show();
    </script>
    {{end}}
</body>

</html>
